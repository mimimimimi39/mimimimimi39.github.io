<div class="bf-player" id="bf-player">
  <button class="bf-player-toggle" id="bf-player-toggle" type="button" aria-label="打开音乐播放器" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>

  <div class="bf-player-panel" role="dialog" aria-label="音乐播放器">
    <div class="bf-player-head">
      <span>NOW PLAYING</span>
      <button class="bf-player-close" id="bf-player-close" type="button" aria-label="收起播放器">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="bf-disc" aria-hidden="true"></div>
    <div class="bf-track-title" id="bf-track-title">Toby Fox</div>
    <div class="bf-track-artist" id="bf-track-artist">mimi小窝</div>

    <div class="bf-progress">
      <input class="bf-range" id="bf-seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度">
      <div class="bf-progress-row"><span id="bf-current">0:00</span><span id="bf-duration">0:00</span></div>
    </div>

    <div class="bf-controls">
      <button class="bf-control" id="bf-prev" type="button" aria-label="上一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M19 6l-9 6 9 6V6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="bf-control bf-control-main" id="bf-play" type="button" aria-label="播放">
        <svg id="bf-icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor"/></svg>
        <svg id="bf-icon-pause" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor"/></svg>
      </button>
      <button class="bf-control" id="bf-next" type="button" aria-label="下一首">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M5 6l9 6-9 6V6Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="bf-control" id="bf-loop" type="button" aria-label="列表循环">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M7 21l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10V9a4 4 0 0 1 4-4h12M20 14v1a4 4 0 0 1-4 4H4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="bf-volume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input class="bf-range" id="bf-volume" type="range" min="0" max="1" value="0.1" step="0.01" aria-label="音量">
    </div>

    <ol class="bf-playlist" id="bf-playlist"></ol>
    <p class="bf-player-hint">三首歌单 · 列表循环 · 自动记忆音量</p>
    <audio id="bf-audio" preload="metadata"></audio>
  </div>
</div>

<canvas id="bf-trail" aria-hidden="true"></canvas>

<script>
(() => {
  const path = decodeURIComponent(window.location.pathname);
  let accent = "";
  if (/^\/posts\/隐写/.test(path)) accent = "cyan";
  else if (/^\/posts\/编码/.test(path)) accent = "indigo";
  else if (/^\/about/.test(path)) accent = "teal";
  else if (/^\/tags/.test(path)) accent = "sky";
  else if (/^\/categories/.test(path)) accent = "violet";
  if (accent) document.documentElement.dataset.accent = accent;

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fine = window.matchMedia("(pointer: fine)").matches;

  const trail = document.getElementById("bf-trail");
  if (trail && fine && !reduce) {
    const ctx = trail.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let points = [];
    let running = false;

    const resize = () => {
      trail.width = Math.floor(window.innerWidth * dpr);
      trail.height = Math.floor(window.innerHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    const render = () => {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      points = points.filter((p) => p.life > 0.03);
      for (let i = 1; i < points.length; i += 1) {
        const a = points[i - 1];
        const b = points[i];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = "rgba(34, 211, 238, " + (b.life * 0.22).toFixed(3) + ")";
        ctx.lineWidth = 1 + b.life * 4;
        ctx.lineCap = "round";
        ctx.stroke();
      }
      for (const p of points) {
        p.life *= 0.965;
        const r = 2 + p.life * 7;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(34, 211, 238, " + (p.life * 0.3).toFixed(3) + ")";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1, r * 0.4), 0, Math.PI * 2);
        ctx.fillStyle = "rgba(165, 243, 252, " + (p.life * 0.7).toFixed(3) + ")";
        ctx.fill();
      }
      if (points.length) {
        requestAnimationFrame(render);
      } else {
        running = false;
      }
    };

    window.addEventListener("pointermove", (event) => {
      if (event.pointerType === "touch") return;
      points.push({ x: event.clientX, y: event.clientY, life: 1 });
      if (points.length > 26) points.shift();
      if (!running) {
        running = true;
        requestAnimationFrame(render);
      }
    }, { passive: true });

    window.addEventListener("resize", resize);
    resize();
  }

  const root = document.getElementById("bf-player");
  if (!root) return;
  const audio = document.getElementById("bf-audio");
  const toggle = document.getElementById("bf-player-toggle");
  const close = document.getElementById("bf-player-close");
  const title = document.getElementById("bf-track-title");
  const artist = document.getElementById("bf-track-artist");
  const seek = document.getElementById("bf-seek");
  const current = document.getElementById("bf-current");
  const duration = document.getElementById("bf-duration");
  const play = document.getElementById("bf-play");
  const prev = document.getElementById("bf-prev");
  const next = document.getElementById("bf-next");
  const loop = document.getElementById("bf-loop");
  const volume = document.getElementById("bf-volume");
  const list = document.getElementById("bf-playlist");
  const iconPlay = document.getElementById("bf-icon-play");
  const iconPause = document.getElementById("bf-icon-pause");

  const tracks = [
    { title: "Toby Fox", artist: "mimi小窝", src: encodeURI("{{ "music/Toby Fox.mp3" | relURL }}") },
    { title: "存活千年 (G0RA Remix)", artist: "mimi小窝", src: encodeURI("{{ "music/存活千年【G0RA Remix】.mp3" | relURL }}") },
    { title: "空に免じて (念及长空)", artist: "mimi小窝", src: encodeURI("{{ "music/空に免じて(念及长空).mp3" | relURL }}") }
  ];

  let index = Number(localStorage.getItem("bf-track") || 0);
  if (!Number.isFinite(index) || index < 0 || index >= tracks.length) index = 0;
  let repeat = localStorage.getItem("bf-loop") === "1";
  let dragging = false;

  const fmt = (value) => {
    if (!Number.isFinite(value)) return "0:00";
    const m = Math.floor(value / 60);
    const s = Math.floor(value % 60);
    return m + ":" + String(s).padStart(2, "0");
  };

  const updateMeta = () => {
    title.textContent = tracks[index].title;
    artist.textContent = tracks[index].artist;
    list.querySelectorAll("button").forEach((btn, i) => {
      btn.classList.toggle("is-current", i === index);
      btn.setAttribute("aria-current", i === index ? "true" : "false");
    });
    if ("mediaSession" in navigator && "MediaMetadata" in window) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: tracks[index].title,
        artist: tracks[index].artist,
        album: "{{ .Site.Title }}"
      });
    }
  };

  const load = (i, autoplay) => {
    index = (i + tracks.length) % tracks.length;
    localStorage.setItem("bf-track", String(index));
    audio.src = tracks[index].src;
    updateMeta();
    seek.value = "0";
    current.textContent = "0:00";
    duration.textContent = "0:00";
    if (autoplay) {
      audio.play().catch(() => {});
    }
  };

  const syncIcon = () => {
    const playing = !audio.paused;
    root.classList.toggle("is-playing", playing);
    iconPlay.style.display = playing ? "none" : "";
    iconPause.style.display = playing ? "" : "none";
    play.setAttribute("aria-label", playing ? "暂停" : "播放");
  };

  tracks.forEach((track, i) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.innerHTML = '<span class="bf-pl-index">' + String(i + 1).padStart(2, "0") + "</span><span>" + track.title + "</span>";
    btn.addEventListener("click", () => load(i, true));
    li.appendChild(btn);
    list.appendChild(li);
  });

  const setOpen = (open) => {
    root.classList.toggle("is-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.setAttribute("aria-label", open ? "收起音乐播放器" : "打开音乐播放器");
  };

  toggle.addEventListener("click", () => setOpen(!root.classList.contains("is-open")));
  close.addEventListener("click", () => setOpen(false));

  play.addEventListener("click", () => {
    if (audio.paused) {
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
  });

  prev.addEventListener("click", () => load(index - 1, true));
  next.addEventListener("click", () => load(index + 1, true));

  loop.classList.toggle("is-active", repeat);
  loop.setAttribute("aria-pressed", repeat ? "true" : "false");
  loop.addEventListener("click", () => {
    repeat = !repeat;
    localStorage.setItem("bf-loop", repeat ? "1" : "0");
    loop.classList.toggle("is-active", repeat);
    loop.setAttribute("aria-pressed", repeat ? "true" : "false");
    audio.loop = false;
  });

  const savedVolume = Number.parseFloat(localStorage.getItem("bf-volume-v2"));
  volume.value = Number.isFinite(savedVolume) ? String(Math.min(1, Math.max(0, savedVolume))) : "0.1";
  audio.volume = Number(volume.value);
  volume.addEventListener("input", () => {
    audio.volume = Number(volume.value);
    localStorage.setItem("bf-volume-v2", volume.value);
  });

  seek.addEventListener("pointerdown", () => { dragging = true; });
  seek.addEventListener("pointerup", () => { dragging = false; });
  seek.addEventListener("input", () => {
    if (!Number.isFinite(audio.duration)) return;
    current.textContent = fmt((Number(seek.value) / 100) * audio.duration);
  });
  seek.addEventListener("change", () => {
    if (!Number.isFinite(audio.duration)) return;
    audio.currentTime = (Number(seek.value) / 100) * audio.duration;
  });

  audio.addEventListener("loadedmetadata", () => {
    duration.textContent = fmt(audio.duration);
  });
  audio.addEventListener("timeupdate", () => {
    if (!dragging && Number.isFinite(audio.duration) && audio.duration > 0) {
      seek.value = String((audio.currentTime / audio.duration) * 100);
    }
    current.textContent = fmt(audio.currentTime);
  });
  audio.addEventListener("play", syncIcon);
  audio.addEventListener("pause", syncIcon);
  audio.addEventListener("ended", () => {
    if (repeat) {
      load(index + 1, true);
    } else if (index + 1 < tracks.length) {
      load(index + 1, true);
    } else {
      syncIcon();
    }
  });

  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("previoustrack", () => load(index - 1, true));
      navigator.mediaSession.setActionHandler("nexttrack", () => load(index + 1, true));
      navigator.mediaSession.setActionHandler("play", () => audio.play().catch(() => {}));
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    } catch (error) {}
  }

  load(index, false);
  syncIcon();

  if (document.querySelector(".bf-hero")) {
    const startMusic = () => {
      if (audio.paused) audio.play().catch(() => {});
    };
    const unlock = () => {
      startMusic();
      document.removeEventListener("pointerdown", unlock);
      document.removeEventListener("keydown", unlock);
      document.removeEventListener("touchstart", unlock);
    };
    startMusic();
    document.addEventListener("pointerdown", unlock, { once: true, passive: true });
    document.addEventListener("keydown", unlock, { once: true });
    document.addEventListener("touchstart", unlock, { once: true, passive: true });
  }
})();
</script>
